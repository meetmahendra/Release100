<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} — Release100</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center">
  <div class="w-full max-w-md px-4">
    <div class="bg-white/5 border border-white/10 rounded-2xl p-8 shadow-2xl backdrop-blur">

      <!-- Logo / Branding -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-500/20 mb-4">
          <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04
                 A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03
                 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">Release100 Admin</h1>
        <p class="text-slate-400 text-sm mt-1">CaneBot Platform Control Panel</p>
      </div>

      <!-- Error Message -->
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/20 border border-red-500/40 text-red-300 text-sm">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <!-- Login Form -->
      <form method="post" action="/admin/login" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input
            id="username" name="username" type="text" required autocomplete="username"
            class="w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/15 text-white
                   placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
            placeholder="admin"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input
            id="password" name="password" type="password" required autocomplete="current-password"
            class="w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/15 text-white
                   placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold
                 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-400"
        >
          Sign In
        </button>
      </form>

      <p class="text-center text-slate-500 text-xs mt-6">
        GEES v1.0 · Apache 2.0 · Copyright 2026 Mahendra GURAV
      </p>
    </div>
  </div>
</body>
</html>
