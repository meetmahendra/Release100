# ============================================================
# Default Action Rules — shipped with the application.
# Maps each email category to an ordered list of actions.
# Do NOT edit this file directly — use overrides.yaml instead.
#
# Supported action types:
#   keep_inbox        — keep the email in INBOX (no-op, explicit intent)
#   remove_inbox      — archive: remove INBOX label
#   apply_label       — apply a Gmail label (label: required)
#   star_thread       — star the entire thread
#   mark_as_read      — remove UNREAD label
#   create_draft_reply — generate and save a draft (only if reply_necessary=true)
#   create_user_task  — create a local user task (not a draft)
#   queue_pm_task     — queue a project management action (user approval required)
#   safe_archive      — move to _LLM/<label> (reversible archive)
#
# Conditional fields:
#   if_reply_necessary: true   — only run if is_reply_necessary=true
#   if_pm_enabled: true        — only run if PM integration is configured
# ============================================================

categories:

  "Action Required (High)":
    - action: keep_inbox
    - action: apply_label
      label: "@Urgent"
    - action: star_thread
    - action: create_draft_reply
      if_reply_necessary: true
    - action: queue_pm_task
      if_pm_enabled: true

  "Action Required (Med/Low)":
    - action: remove_inbox
    - action: apply_label
      label: "@Action_Required"
    - action: create_draft_reply
      if_reply_necessary: true
    - action: queue_pm_task
      if_pm_enabled: true

  "Calendar/Scheduling":
    - action: remove_inbox
    - action: apply_label
      label: "@Scheduling"
    - action: create_draft_reply
      if_reply_necessary: true

  "Informational/Logs":
    - action: remove_inbox
    - action: apply_label
      label: "Log/Updates"
    - action: mark_as_read

  "Receipts/Financial":
    - action: remove_inbox
    - action: apply_label
      label: "Finance/Receipts"
    - action: mark_as_read
    - action: apply_label
      label: "@Expense_Review"

  "Promotions/Marketing":
    - action: remove_inbox
    - action: safe_archive
      label: "_LLM/Promotions"
    - action: mark_as_read

  "Spam/Trash":
    - action: safe_archive
      label: "_LLM/Suspected_Spam"
    - action: mark_as_read

  "System Alert":
    - action: keep_inbox
    - action: apply_label
      label: "@System_Alert"
    - action: create_user_task

  "Needs Review":
    - action: keep_inbox
    - action: apply_label
      label: "@Review_Needed"
