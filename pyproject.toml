[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release100-core"
version = "3.0.5"
description = "Release100 Enterprise Multi-Kiosk Platform Microkernel (GEES v3.0)"
authors = [{ name = "Mahendra GURAV" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "certifi",
    "numpy>=1.24.0",
    "pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.15.0",
    "cryptography>=41.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0.0",
    "python-multipart>=0.0.6",
    "alembic>=1.12.0",
    "PyJWT>=2.8.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "pystray>=0.19.0",
]

[project.optional-dependencies]
all-databases = [
    "duckdb>=0.9.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.4.0",
    "setuptools>=61.0",
    "wheel",
    "build",
]

[project.scripts]
release100 = "core_platform.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core_platform*", "ops_control_plane*", "deployment*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.svg", "*.ico", "*.png", "*.sql"]
"core_platform.app.admin_shell" = ["templates/*.html", "templates/**/*.html"]
"core_platform.app.diagnostics" = ["templates/*.html", "templates/**/*.html"]
"ops_control_plane.super_admin" = ["templates/*.html", "templates/**/*.html"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
exclude = ["build", "dist", ".venv", "apps/.*/build", "scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

