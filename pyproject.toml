[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release100-core"
version = "2.0.0"
description = "Release100 Enterprise Multi-Kiosk Platform Microkernel (GEES v2.0)"
authors = [{ name = "Mahendra GURAV" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "certifi",
]

[project.optional-dependencies]
all-databases = [
    "duckdb>=0.9.0",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.4.0",
]

[project.scripts]
release100 = "manage:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core_platform*", "deployment*"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
