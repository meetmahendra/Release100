name: Build and Publish Private Packages

on:
  push:
    branches:
      - main
      - intent-router
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target Distribution Channel (main or intent-router)'
        required: false
        default: 'auto'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build Wheels & Publish Multi-Channel Package Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Distribution Channel
        id: channel-step
        run: |
          if [ "${{ github.event.inputs.channel }}" != "" ] && [ "${{ github.event.inputs.channel }}" != "auto" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            CHANNEL="main"
          else
            CHANNEL="intent-router"
          fi
          echo "Target distribution channel: $CHANNEL"
          echo "TARGET_CHANNEL=$CHANNEL" >> $GITHUB_ENV

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build & Publishing Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Core Platform Package (release100-core)
        run: |
          python -m build --sdist --wheel --outdir dist/wheels/core .

      - name: Build Cartridge 1 Package (release100-cartridge-temperature-marker)
        run: |
          python -m build --sdist --wheel --outdir dist/wheels/temperature_marker apps/temperature_marker

      - name: Build Cartridge 2 Package (release100-cartridge-mail-organizer)
        run: |
          python -m build --sdist --wheel --outdir dist/wheels/mail_organizer apps/mail_organizer

      - name: Aggregate All Wheels & Dist Packages
        run: |
          mkdir -p dist/all_wheels
          cp dist/wheels/*/* dist/all_wheels/
          ls -la dist/all_wheels/

      - name: Generate PEP 503 Simple Index Tree for Channel
        run: |
          python packaging/generate_simple_index.py --channel ${{ env.TARGET_CHANNEL }}
          ls -la dist/simple/

      - name: Upload Wheels & Simple Index to GitHub Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/all_wheels/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Channel Simple Index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/simple
          destination_dir: ${{ env.TARGET_CHANNEL }}
          keep_files: true

      - name: Deploy Root Simple Index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/simple
          keep_files: true

  # [CODE-MARKER: TN-GHCR-01] Job 2: Build & Push TrueNAS Multi-Target Docker Images to GHCR
  build-and-push-ghcr-images:
    name: Build & Push TrueNAS Docker Images (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core-runtime
            image: release100-core
          - target: ops-control
            image: release100-ops
          - target: cartridge-mail-organizer
            image: release100-mail-organizer
          - target: cartridge-temperature-marker
            image: release100-temperature-marker
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Tags & Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/intent-router' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and Push ${{ matrix.image }} (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


