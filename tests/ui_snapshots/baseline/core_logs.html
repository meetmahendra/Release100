<script>
  let rawLines = [];
  let autoRefreshInterval = null;
  async function fetchLogs() {
  const lineCount = document.getElementById("lineCount").value;
  try {
  const resp = await fetch(`/admin/api/logs/tail?lines=${lineCount}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  rawLines = data.lines || [];
  applyFilter();
  } catch (err) {
  console.error("Failed to fetch logs:", err);
  }
  }
  function formatLine(line) {
  // Escape HTML
  let escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let levelClass = "log-INFO";
  if (line.includes("[ERROR]")) levelClass = "log-ERROR";
  else if (line.includes("[WARNING]")) levelClass = "log-WARNING";
  // Color tags
  escaped = escaped.replace(/\[corr:([^\]]+)\]/g, '<span class="log-corr">[corr:$#]</span>');
  escaped = escaped.replace(/\[kiosk:([^\]]+)\]/g, '<span class="log-kiosk">[kiosk:$#]</span>');
  return `<div class="log-line ${levelClass}">${escaped}</div>`;
  }
  function applyFilter() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const level = document.getElementById("levelFilter").value;
  const container = document.getElementById("logOutput");
  const filtered = rawLines.filter(line => {
  if (level === "ERROR" && !line.includes("[ERROR]")) return false;
  if (level === "WARNING" && !line.includes("[ERROR]") && !line.includes("[WARNING]")) return false;
  if (level === "INFO" && !line.includes("[ERROR]") && !line.includes("[WARNING]") && !line.includes("[INFO]")) return false;
  if (search && !line.toLowerCase().includes(search)) return false;
  return true;
  });
  if (filtered.length === #) {
  container.innerHTML = '<div class="text-slate-# italic">No matching logs found.</div>';
  } else {
  container.innerHTML = filtered.map(formatLine).join("");
  }
  // Auto-scroll to bottom
  const terminal = document.getElementById("terminalContainer");
  terminal.scrollTop = terminal.scrollHeight;
  }
  function toggleAutoRefresh() {
  const isChecked = document.getElementById("autoRefreshToggle").checked;
  if (isChecked) {
  if (!autoRefreshInterval) autoRefreshInterval = setInterval(fetchLogs, #);
  } else {
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
  }
  }
  function clearDisplay() {
  rawLines = [];
  document.getElementById("logOutput").innerHTML = '<div class="text-slate-# italic">Display cleared. New logs will appear on next interval.</div>';
  }
  // Initial load
  fetchLogs();
  autoRefreshInterval = setInterval(fetchLogs, #);
</script>
</body>
