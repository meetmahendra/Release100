[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release100-cartridge-temperature-marker"
version = "1.0.2"
description = "Industrial HACCP Temperature Verification & Biometric Face Attendance Cartridge for Release100"
authors = [{ name = "Mahendra GURAV" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "release100-core",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.24.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.entry-points."release100.cartridges"]
temperature_marker = "apps.temperature_marker.plugin:TemperatureMarkerPlugin"

[tool.setuptools.package-dir]
"apps.temperature_marker" = "."
"apps.temperature_marker.common" = "common"
"apps.temperature_marker.database" = "database"
"apps.temperature_marker.downstream" = "downstream"
"apps.temperature_marker.graph" = "graph"
"apps.temperature_marker.graph.nodes" = "graph/nodes"
"apps.temperature_marker.knowledge_graph" = "knowledge_graph"
"apps.temperature_marker.services" = "services"
"apps.temperature_marker.ui" = "ui"

[tool.setuptools]
packages = [
    "apps.temperature_marker",
    "apps.temperature_marker.common",
    "apps.temperature_marker.database",
    "apps.temperature_marker.downstream",
    "apps.temperature_marker.graph",
    "apps.temperature_marker.graph.nodes",
    "apps.temperature_marker.knowledge_graph",
    "apps.temperature_marker.services",
    "apps.temperature_marker.ui",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.svg", "*.ico", "*.png", "*.sql", "*.onnx"]
"apps.temperature_marker.ui" = ["templates/*.html", "templates/**/*.html"]
"apps.temperature_marker.knowledge_graph" = ["*.json"]
