{% block title %}Fleet Telemetry & Operations Control — Release100{% endblock %}

{% block extra_head %}
<style>
  :root {
    --bg-main: #020617;
    --bg-card: #0f172a;
    --bg-card-hover: #1e293b;
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent-green: #10b981;
    --accent-yellow: #f59e0b;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
  }

  .card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
  }

  .badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .badge-green { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
  .badge-yellow { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
  .badge-red { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
  .badge-blue { background-color: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }

  .btn-primary { background-color: var(--accent-blue); color: white; }
  .btn-primary:hover { background-color: #2563eb; }
  .btn-success { background-color: var(--accent-green); color: white; }
  .btn-success:hover { background-color: #059669; }
  .btn-danger { background-color: var(--accent-red); color: white; }
  .btn-danger:hover { background-color: #dc2626; }
</style>
{% endblock %}

{% block content %}
{% endblock %}
