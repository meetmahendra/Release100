<!-- Modal 1: Add New Kiosk -->
<div id="kioskModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: #1e293b; border: 1px solid #334155;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 style="font-size: 1.25rem; font-weight: 700; color: white;">+ Register New KioskNode Kiosk</h3>
            <button onclick="closeModal('kioskModal')" style="background: none; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer;">✕</button>
        </div>
        <form onsubmit="submitNewKiosk(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Kiosk ID *</label>
                <input id="newKioskId" required placeholder="e.g. NODE-HYD-01"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Site / Mall Name *</label>
                <input id="newSiteName" required placeholder="e.g. Inorbit Mall Cyberabad"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">City *</label>
                <input id="newCity" required placeholder="e.g. Hyderabad"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Latitude *</label>
                    <input id="newLat" required type="number" step="any" placeholder="17.4348"
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Longitude *</label>
                    <input id="newLon" required type="number" step="any" placeholder="78.3867"
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
                </div>
            </div>
            <button type="button" onclick="detectBrowserLocation()" class="btn btn-secondary" style="padding: 0.4rem; font-size: 0.8rem; align-self: flex-start;">
                📍 Auto-fill Current Browser GPS
            </button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Geofence Radius (m)</label>
                    <input id="newRadius" type="number" value="100"
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Machine Model</label>
                    <input id="newModel" value="ChillerNode-Pro-X1"
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
                <button type="button" onclick="closeModal('kioskModal')" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary" style="background-color: #10b981; border-color: #10b981;">Save Kiosk</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal 2: Add Operator -->
<div id="operatorModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 480px; background: #1e293b; border: 1px solid #334155;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 style="font-size: 1.25rem; font-weight: 700; color: white;">+ Enroll Field Operator</h3>
            <button onclick="closeModal('operatorModal')" style="background: none; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer;">✕</button>
        </div>
        <form onsubmit="submitNewOperator(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Employee Code (Optional)</label>
                <input id="newEmpCode" placeholder="Leave blank to auto-generate (e.g. EMP-1045)"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Full Name *</label>
                <input id="newFullName" required placeholder="e.g. Ramesh Patil"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">WhatsApp Phone Number *</label>
                <input id="newPhone" required placeholder="e.g. 8087545430 or +918087545430"
                       oninput="previewPhoneFormat(this.value, 'newPhonePreview')"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
                <span id="newPhonePreview" style="color: #38bdf8; font-size: 0.75rem; display: block; margin-top: 0.2rem; font-family: monospace;"></span>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Assign to Initial Kiosk *</label>
                <select id="newAssignedKiosk" required
                        style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;">
                    {% for k in kiosks %}
                    <option value="{{ k.kiosk_id }}">{{ k.kiosk_id }} — {{ k.name }} ({{ k.city }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Reporting Manager / Supervisor (Optional)</label>
                <select id="newReportingManager"
                        style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;">
                    <option value="">-- No Manager Assigned --</option>
                    {% for m in managers %}
                    <option value="{{ m.emp_code }}">{{ m.full_name }} ({{ m.emp_code }})</option>
                    {% endfor %}
                    {% for e in employees if e not in managers %}
                    <option value="{{ e.emp_code }}">{{ e.full_name }} ({{ e.emp_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Operator Facial Photo (Optional)</label>
                <input type="file" id="newPhoto" accept="image/*"
                       style="width: 100%; padding: 0.5rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 0.85rem;" />
                <span style="color: #64748b; font-size: 0.75rem; display: block; margin-top: 0.2rem;">
                    If omitted, the operator will receive an automated WhatsApp message to submit their selfie photo.
                </span>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
                <button type="button" onclick="closeModal('operatorModal')" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary" id="enrollSubmitBtn">Enroll Operator</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal 3: Edit Operator -->
<div id="editMemberModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 480px; background: #1e293b; border: 1px solid #334155;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <h3 style="font-size: 1.25rem; font-weight: 700; color: white;">✏️ Edit Operator Profile</h3>
            <button onclick="closeModal('editMemberModal')" style="background: none; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer;">✕</button>
        </div>
        <form onsubmit="submitEditMember(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="hidden" id="editEmpCode" />
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Employee Code</label>
                <div id="editEmpCodeDisplay" style="padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: #a78bfa; font-family: monospace; font-weight: 600;"></div>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Full Name *</label>
                <input id="editFullName" required
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">WhatsApp Phone Number *</label>
                <input id="editPhone" required oninput="previewPhoneFormat(this.value, 'editPhonePreview')"
                       style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white; font-family: monospace;" />
                <span id="editPhonePreview" style="color: #38bdf8; font-size: 0.75rem; display: block; margin-top: 0.2rem; font-family: monospace;"></span>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Assigned Kiosk *</label>
                <select id="editAssignedKiosk" required
                        style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;">
                    {% for k in kiosks %}
                    <option value="{{ k.kiosk_id }}">{{ k.kiosk_id }} — {{ k.name }} ({{ k.city }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Reporting Manager / Supervisor</label>
                <select id="editReportingManager"
                        style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;">
                    <option value="">-- No Manager Assigned --</option>
                    {% for m in managers %}
                    <option value="{{ m.emp_code }}">{{ m.full_name }} ({{ m.emp_code }})</option>
                    {% endfor %}
                    {% for e in employees if e not in managers %}
                    <option value="{{ e.emp_code }}">{{ e.full_name }} ({{ e.emp_code }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Operational Status *</label>
                <select id="editStatus" required
                        style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;">
                    <option value="ACTIVE">ACTIVE (Authorized for Duty)</option>
                    <option value="PENDING_APPROVAL">PENDING_APPROVAL (Under Admin Review)</option>
                    <option value="PENDING_PHOTO">PENDING_PHOTO (Awaiting Selfie Photo)</option>
                    <option value="INACTIVE">INACTIVE (Suspended / Deactivated)</option>
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
                <button type="button" onclick="closeModal('editMemberModal')" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary" id="editSubmitBtn">Save Changes</button>
            </div>
        </form>
    </div>
</div>
