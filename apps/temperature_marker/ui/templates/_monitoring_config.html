<!-- Tab 3: Multi-Check HACCP Rules Config -->
<div id="tab-config" class="tab-panel">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <h3 style="font-size: 1.2rem; font-weight: 700; color: white; margin-bottom: 0.5rem;">
            {{ t('apps.temperature_marker.monitoring.config_title') }}
        </h3>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 1.5rem;">
            {{ t('apps.temperature_marker.monitoring.config_subtitle') }}
        </p>

        <form onsubmit="saveGlobalConfig(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.35rem;">{{ t('apps.temperature_marker.monitoring.lbl_required_daily_checks') }}</label>
                    <input type="number" id="cfgRequiredChecks" min="1" max="12" value="{{ kiosk_configs.get('GLOBAL_DEFAULT').required_daily_temp_checks if kiosk_configs.get('GLOBAL_DEFAULT') else 3 }}" required
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                    <span style="font-size: 0.75rem; color: #64748b;">{{ t('apps.temperature_marker.monitoring.hint_required_checks') }}</span>
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.35rem;">{{ t('apps.temperature_marker.monitoring.lbl_check_interval') }}</label>
                    <input type="number" step="0.5" id="cfgIntervalHours" min="0.5" max="24.0" value="{{ kiosk_configs.get('GLOBAL_DEFAULT').check_interval_hours if kiosk_configs.get('GLOBAL_DEFAULT') else 4.0 }}" required
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                    <span style="font-size: 0.75rem; color: #64748b;">{{ t('apps.temperature_marker.monitoring.hint_interval') }}</span>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.35rem;">{{ t('apps.temperature_marker.monitoring.lbl_min_safe_temp') }}</label>
                    <input type="number" step="0.1" id="cfgMinTemp" value="{{ kiosk_configs.get('GLOBAL_DEFAULT').min_safe_temp if kiosk_configs.get('GLOBAL_DEFAULT') else 2.0 }}" required
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.35rem;">{{ t('apps.temperature_marker.monitoring.lbl_max_safe_temp') }}</label>
                    <input type="number" step="0.1" id="cfgMaxTemp" value="{{ kiosk_configs.get('GLOBAL_DEFAULT').max_safe_temp if kiosk_configs.get('GLOBAL_DEFAULT') else 4.0 }}" required
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                </div>
                <div>
                    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.35rem;">{{ t('apps.temperature_marker.monitoring.lbl_crit_alert_temp') }}</label>
                    <input type="number" step="0.1" id="cfgCritTemp" value="{{ kiosk_configs.get('GLOBAL_DEFAULT').critical_alert_temp if kiosk_configs.get('GLOBAL_DEFAULT') else 7.0 }}" required
                           style="width: 100%; padding: 0.6rem; border-radius: 6px; background: #0f172a; border: 1px solid #334155; color: white;" />
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="cfgAlertManager" checked style="width: 18px; height: 18px;" />
                <label for="cfgAlertManager" style="font-size: 0.88rem; color: #e2e8f0; cursor: pointer;">
                    {{ t('apps.temperature_marker.monitoring.lbl_push_alert') }}
                </label>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                <button type="submit" class="btn btn-primary" id="btnSaveConfig" style="padding: 0.6rem 1.5rem;">
                    {{ t('apps.temperature_marker.monitoring.btn_save_policy') }}
                </button>
            </div>
        </form>
    </div>
</div>
