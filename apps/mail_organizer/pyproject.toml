[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release100-cartridge-mail-organizer"
version = "1.0.0"
description = "Autonomous AI Email Triage & Calendar Task Management Cartridge for Release100"
authors = [{ name = "Mahendra GURAV" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "release100-core",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "sqlalchemy>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pyyaml>=6.0.0",
    "typing-extensions>=4.8.0",
    "httpx>=0.24.0",
]

[project.entry-points."release100.cartridges"]
mail_organizer = "apps.mail_organizer.plugin:MailOrganizerPlugin"

[tool.setuptools.package-dir]
"apps.mail_organizer" = "."
"apps.mail_organizer.connectors" = "connectors"
"apps.mail_organizer.database" = "database"
"apps.mail_organizer.graph" = "graph"
"apps.mail_organizer.graph.nodes" = "graph/nodes"
"apps.mail_organizer.mcp" = "mcp"
"apps.mail_organizer.pm" = "pm"
"apps.mail_organizer.services" = "services"
"apps.mail_organizer.ui" = "ui"

[tool.setuptools]
packages = [
    "apps.mail_organizer",
    "apps.mail_organizer.connectors",
    "apps.mail_organizer.database",
    "apps.mail_organizer.graph",
    "apps.mail_organizer.graph.nodes",
    "apps.mail_organizer.mcp",
    "apps.mail_organizer.pm",
    "apps.mail_organizer.services",
    "apps.mail_organizer.ui",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.svg", "*.ico", "*.png", "*.sql"]
"apps.mail_organizer.ui" = ["templates/*.html", "templates/**/*.html"]
