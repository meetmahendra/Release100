{% extends "base.html" %}

{% block title %}{{ t('apps.mail_organizer.dashboard.title_tag') }}{% endblock %}

{% block content %}
<style>
    .trace-container { max-width: 100%; }
    .trace-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 1.25rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .badge-source {
        background: #1e3a8a;
        color: #93c5fd;
        padding: 0.25rem 0.65rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
    }
    .badge-mode {
        background: #334155;
        color: #f1f5f9;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
    }
    .controls-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.85rem 1.25rem;
        margin-bottom: 1.5rem;
        gap: 1rem;
        flex-wrap: wrap;
    }
    .search-box {
        flex-grow: 1;
        max-width: 450px;
        background: #090d16;
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 0.5rem 0.9rem;
        border-radius: 6px;
        font-size: 0.85rem;
    }
    .search-box:focus {
        outline: none;
        border-color: var(--accent-primary);
    }
    .scenario-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-bottom: 1rem;
        overflow: hidden;
        transition: border-color 0.2s;
    }
    .scenario-card:hover {
        border-color: #3b82f6;
    }
    .scenario-header {
        padding: 1rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        gap: 1rem;
        background: var(--bg-card);
        user-select: none;
    }
    .scenario-header::-webkit-details-marker { display: none; }
    .scenario-body {
        padding: 1.25rem;
        border-top: 1px solid var(--border-color);
        background: #0d1424;
    }
    .tab-bar {
        display: flex;
        gap: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.75rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
    }
    .tab-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
    }
    .tab-btn:hover {
        color: var(--text-primary);
        background: var(--bg-card-hover);
    }
    .tab-btn.active {
        background: #3b82f6;
        color: #ffffff;
        border-color: #60a5fa;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .content-box {
        background: #070a12;
        border: 1px solid #1e293b;
        border-radius: 6px;
        padding: 0.85rem;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.8rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cbd5e1;
        max-height: 320px;
        overflow-y: auto;
    }
    .sub-card {
        background: #090d16;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 0.85rem;
        margin-bottom: 0.85rem;
    }
    .meta-row { display: flex; margin-bottom: 0.45rem; gap: 0.75rem; font-size: 0.85rem; }
    .meta-label { color: var(--text-secondary); width: 125px; flex-shrink: 0; font-weight: 600; }
    .tag-chip {
        display: inline-block;
        background: #0369a1;
        color: #e0f2fe;
        font-size: 0.72rem;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        margin-right: 0.35rem;
        margin-bottom: 0.35rem;
    }
    .breadcrumb-trail {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
        font-family: monospace;
        font-size: 0.78rem;
        background: #070a12;
        padding: 0.75rem;
        border-radius: 6px;
        border: 1px solid #1e293b;
    }
    .breadcrumb-node {
        background: #1e293b;
        padding: 0.25rem 0.55rem;
        border-radius: 4px;
        color: #38bdf8;
        border: 1px solid #334155;
    }
    .btn-filter {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-secondary);
        padding: 0.35rem 0.75rem;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-filter.active {
        background: #2563eb;
        color: #fff;
        border-color: #3b82f6;
    }
</style>

<div class="trace-container">
    {% include "_dashboard_header.html" %}
    {% include "_dashboard_trace_cards.html" %}
</div>

<script>
    function switchTraceTab(cardId, tabName, ev) {
        const body = document.getElementById(cardId + '_' + tabName).closest('.scenario-body');
        body.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        body.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        if (ev && ev.target) ev.target.classList.add('active');
        document.getElementById(cardId + '_' + tabName).classList.add('active');
    }

    function toggleAllDetails(expand) {
        document.querySelectorAll('#traceCardsList details').forEach(d => {
            d.open = expand;
        });
    }

    function filterCategory(cat, btn) {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        const cards = document.querySelectorAll('#traceCardsList details.scenario-card');
        cards.forEach(card => {
            if (cat === 'all') {
                card.style.display = 'block';
            } else if (cat === 'diverted') {
                card.style.display = card.getAttribute('data-diverted') === 'true' ? 'block' : 'none';
            } else {
                const cardCat = card.getAttribute('data-category');
                card.style.display = (cardCat === cat.toLowerCase()) ? 'block' : 'none';
            }
        });
    }

    function filterTraceCards() {
        const q = (document.getElementById('traceSearchInput').value || '').toLowerCase().trim();
        const cards = document.querySelectorAll('#traceCardsList details.scenario-card');
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(q) ? 'block' : 'none';
        });
    }
</script>
{% endblock %}
